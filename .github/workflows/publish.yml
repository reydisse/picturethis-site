name: Publish site

# Every change to main (Pages CMS saves included) is built and deployed to Cloudflare Pages.
# Pull requests are only built, to catch mistakes before they reach main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check forms still use the site's own endpoint
        run: |
          if grep -rqi formsubmit dist; then echo "dist mentions FormSubmit"; exit 1; fi
          grep -q 'data-endpoint="/api/enquiry"' dist/get-involved/index.html
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        # Run from the repository root so functions/ (the /api/enquiry endpoint) is deployed too.
        run: >-
          npx --yes wrangler@4.127.0 pages deploy dist
          --project-name picturethis-site --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "${COMMIT_MESSAGE:0:300}" --commit-dirty=true
